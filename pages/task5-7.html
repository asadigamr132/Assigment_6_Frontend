<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3 - DOM Manipulation</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/task5-7.js" defer></script>
</head>
<body>
    <header>
        <h1>Part 3. DOM Manipulation</h1>
        <p>Tasks 5, 6 and 7</p>
    </header>
    <nav>
        <a href="../index.html">Home</a>
        <a href="task0-1.html">Part 1</a>
        <a href="task2-4.html">Part 2</a>
        <a href="task5-7.html">Part 3</a>
        <a href="task8-10.html">Part 4</a>
        <a href="task11.html">Mini Project</a>

    <main>
        <section class="card">
            <h2>Task 5. Add & Remove Elements</h2>
            <ul id="itemList">
                <li>First item</li>
                <li>Second item</li>
            </ul>
            <button id="appendItem">Add Item</button>
            <button id="prependItem">Add to Start</button>
            <button id="removeItem">Remove Last Item</button>
        </section>

        <section class="card">
            <h2>Task 6. Modifying Attributes</h2>
            <img id="changeImage" class="demo-image" src="https://picsum.photos/id/1025/520/300" alt="Dog">
            <button id="changeSrc">Change Image</button>
            <p><a id="changeLink" href="https://jquery.com/" target="_blank">Open jQuery website</a></p>
            <button id="changeHref">Change Link</button>
        </section>

        <section class="card">
            <h2>Task 7. Form Interaction</h2>
            <form id="userForm">
                <label for="userName">Name</label>
                <input type="text" id="userName" placeholder="Enter your name">

                <label for="userEmail">Email</label>
                <input type="email" id="userEmail" placeholder="Enter your email">
            </form>
            <h3>Your input:</h3>
            <p class="output">Name: <span id="nameOutput"></span></p>
            <p class="output">Email: <span id="emailOutput"></span></p>
        </section>
    </main>
    <footer>Assignment #6 — jQuery</footer>
</body>
